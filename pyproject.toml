[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontario-nowcast"
version = "0.1.0"
description = "Reproducible precipitation-nowcasting research for Ontario, Canada"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "requests>=2.32",
  "scipy>=1.13",
]

[project.optional-dependencies]
data = [
  "cfgrib>=0.9.15",
  "eccodes>=2.38",
  "h5py>=3.11",
  "h5netcdf>=1.3",
  "pyproj>=3.7",
  "xarray>=2024.6",
]
baseline = [
  "opencv-python-headless>=4.10",
  "pysteps>=1.21; platform_system != 'Windows'",
]
viz = [
  "matplotlib>=3.9",
]
demo = [
  "matplotlib>=3.9",
  "streamlit>=1.40",
]
operational = [
  "torch>=2.5",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
nowcast-estimate-storage = "ontario_nowcast.storage:main"
nowcast-run-demo = "ontario_nowcast.demo:main"
nowcast-fetch-mrms-sample = "ontario_nowcast.data.sample:main"
nowcast-evaluate-sample = "ontario_nowcast.sample_evaluation:main"
nowcast-fetch-multimodal-sample = "ontario_nowcast.data.multimodal:main"
nowcast-build-fused-sample = "ontario_nowcast.preprocessing.fuse:main"
nowcast-run-benchmark = "ontario_nowcast.benchmark:main"
nowcast-verify-hard-negatives = "ontario_nowcast.features.environment:main"
nowcast-build-stage3-manifest = "ontario_nowcast.training.stage3_data:main"
nowcast-train-stage3 = "ontario_nowcast.training.stage3_train:main"
nowcast-evaluate-stage3 = "ontario_nowcast.training.stage3_eval:main"
nowcast-stage3-diagnostics = "ontario_nowcast.training.stage3_diagnostics:main"
nowcast-stage31-head-analysis = "ontario_nowcast.training.stage31_analysis:main"
nowcast-stage31-lifecycle = "ontario_nowcast.training.stage31_lifecycle:main"
nowcast-stage4-audit = "ontario_nowcast.training.stage4_audit:main"
nowcast-stage4-gate = "ontario_nowcast.training.stage4_gate:main"
nowcast-stage4-materialize = "ontario_nowcast.training.stage4_materialize:main"
nowcast-stage4-materialize-goes = "ontario_nowcast.training.stage4_materialize:main"
nowcast-stage4b-train = "ontario_nowcast.training.stage4b_train:main"
nowcast-stage4b-eval = "ontario_nowcast.training.stage4b_eval:main"
nowcast-stage4b-lifecycle = "ontario_nowcast.training.stage4b_lifecycle:main"
nowcast-stage4b-final-decision = "ontario_nowcast.training.stage4b_final_decision:main"
nowcast-stage4b-holdout = "ontario_nowcast.training.stage4b_holdout:main"
nowcast-stage4c-radar-poor = "ontario_nowcast.training.stage4c_radar_poor:main"
nowcast-stage4c-radar-limited = "ontario_nowcast.training.stage4c_radar_limited:main"
nowcast-stage4c-tensors = "ontario_nowcast.training.stage4c_tensors:main"
nowcast-stage4c-prepare = "ontario_nowcast.training.stage4c_prepare:main"
nowcast-stage4c-baselines = "ontario_nowcast.training.stage4c_baselines:main"
nowcast-stage4c-holdout-sources = "ontario_nowcast.training.stage4c_holdout_sources:main"
nowcast-stage4b-capacity = "ontario_nowcast.training.stage4b_capacity:main"
nowcast-stage4b-capacity-eval = "ontario_nowcast.training.stage4b_capacity_eval:main"
nowcast-stage4-tiny-overfit = "ontario_nowcast.training.stage4_tiny_overfit:main"
nowcast-stage4-visuals = "ontario_nowcast.training.stage4_visuals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontario_nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
