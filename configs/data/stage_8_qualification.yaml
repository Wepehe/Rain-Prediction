version: 1
stage: stage_8_event_qualification_only
created_before_object_mining: true
gate_design_authorized: false
projection: EPSG:3978

domain:
  bbox_wgs84: [-84.8, 41.5, -75.5, 46.5]
  source_resolution_degrees: 0.01
  evaluation_resolution_km: 2.0
  tile_pixels: 128

timing:
  cadence_minutes: 6
  history_minutes: 60
  target_minutes: 120

quality_rules:
  maximum_missing_expected_scan_fraction: 0.10
  minimum_finite_fraction_per_retained_tile_window: 0.90
  require_exact_expected_timestamps: true
  source_units: mm h-1
  no_temporal_gap_filling: true
  hrrr_availability_lag_minutes: 60
  maximum_missing_issue_safe_hrrr_fraction: 0.0

object_rules:
  rain_threshold_mm_hr: 0.1
  strong_threshold_mm_hr: 5.0
  minimum_component_pixels_at_2km: 12
  clean_initiation_requires_apparent_initiation: true
  reject_advective_entry: true
  reject_domain_boundary_contact: true
  minimum_future_max_mm_hr: 1.0

positive_event_rule:
  minimum_distinct_clean_issue_times: 3
  require_complete_60min_history_and_120min_target: true
  require_all_retained_tiles_to_pass_finite_fraction: true
  independent_credit_is_binary_per_weather_system: true

hard_negative_rule:
  history_and_target_must_be_radar_dry: true
  rain_threshold_mm_hr: 0.1
  maximum_mean_wet_fraction: 0.001
  maximum_single_frame_wet_fraction: 0.005
  maximum_heavy_rain_fraction: 0.0
  minimum_finite_fraction: 0.90
  minimum_separation_between_issue_times_minutes: 120

